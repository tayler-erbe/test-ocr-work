name: Public benchmark and evidence checks
on:
  push:
  pull_request:
jobs:
  provider-free:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/conformance_requirements.txt
      - run: python tools/check_project.py
